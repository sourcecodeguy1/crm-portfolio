<div class="modal-backdrop fade show" (click)="close()"></div>

<div class="modal fade show d-block" tabindex="-1" style="background: none;">
  <div class="modal-dialog">
    <div class="modal-content">
      <form [formGroup]="invoiceForm" (ngSubmit)="submit()">
        <div class="modal-header">
          <h5 class="modal-title">Add Invoice</h5>
          <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <label>Client ID
            <input class="form-control" formControlName="client_id" type="number" />
          </label>
          <label>Amount
            <input class="form-control" formControlName="amount" type="number" step="0.01" />
          </label>
          <label>Due Date
            <input class="form-control" formControlName="due_date" type="date" />
          </label>
          <label>Status
            <select class="form-control" formControlName="status">
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
            </select>
          </label>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" [disabled]="invoiceForm.invalid">Add</button>
          <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
