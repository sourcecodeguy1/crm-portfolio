<div class="container vh-100 d-flex justify-content-center align-items-center">
  <div class="card p-4 shadow-lg" style="width: 350px;">
    <h2 class="text-center mb-4">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" class="form-control" formControlName="email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password" class="form-control" formControlName="password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>
    </form>

    <div class="d-flex align-items-center my-3">
      <hr class="flex-grow-1">
      <span class="mx-2 text-muted small">or</span>
      <hr class="flex-grow-1">
    </div>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary flex-fill" (click)="loginAsDemo()">
        <i class="fa-solid fa-eye me-1"></i> Viewer Demo
        <span class="badge bg-secondary ms-1">Read-only</span>
      </button>
      <button type="button" class="btn btn-outline-primary flex-fill" (click)="loginAsAdmin()">
        <i class="fa-solid fa-user-shield me-1"></i> Admin Demo
        <span class="badge bg-primary ms-1">Full access</span>
      </button>
    </div>

    <div class="alert alert-light mt-3 mb-0 py-2">
      <small class="text-muted d-block"><i class="fa-solid fa-circle-info me-1"></i> <strong>Viewer:</strong> Browse data only</small>
      <small class="text-muted d-block mt-1"><i class="fa-solid fa-circle-info me-1"></i> <strong>Admin:</strong> Add/edit clients & invoices</small>
    </div>
  </div>
</div>
