server {
    listen 80;

    # Root needs to point to the browser subdirectory where Angular app files are
    root /usr/share/nginx/html/browser;
    index index.html;

    # Assets location
    location /assets/ {
        # Assets are in parent directory
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
    }

    location = /linkedin {
        return 302 /?utm_source=linkedin&utm_medium=projects&utm_campaign=crm;
    }

    # Default location for Angular routing
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Handle errors gracefully
    error_page 404 /index.html;
}
