name: Build, Push & Deploy to Vultr

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Install Dependencies
        working-directory: ./server
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment
        working-directory: ./server
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/testing.sqlite

      - name: Run PHPUnit Tests
        working-directory: ./server
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
        run: ./vendor/bin/phpunit --testsuite Unit

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set APP_VERSION
        run: echo "APP_VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push CRM API (Laravel)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }}:${{ env.APP_VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }}:latest

      - name: Build & Push CRM Client (Angular)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}:${{ env.APP_VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}:latest

  deploy:
    name: Deploy to Vultr
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}

      - name: Compute APP_VERSION for deploy
        run: echo "APP_VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy CRM Client
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.SERVER_DIRECTORY }}
            export CRM_CLIENT_TAG='${{ env.APP_VERSION }}'
            echo "Pulling CRM Client image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}:${CRM_CLIENT_TAG}
            echo "Removing any stale containers..."
            docker rm -f crm-client 2>/dev/null || true
            echo "Restarting CRM Client..."
            CRM_CLIENT_TAG=${CRM_CLIENT_TAG} docker compose up -d --force-recreate crm-client
          EOF

      - name: Deploy CRM API
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.SERVER_DIRECTORY }}
            export CRM_API_TAG='${{ env.APP_VERSION }}'
            echo "Pulling CRM API image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }}:${CRM_API_TAG}
            echo "Removing any stale containers..."
            docker rm -f crm-api 2>/dev/null || true
            echo "Restarting CRM API..."
            CRM_API_TAG=${CRM_API_TAG} docker compose up -d --force-recreate crm-api
            echo "Waiting for API container to be ready..."
            sleep 10
            echo "Running database migrations..."
            docker exec crm-api php artisan migrate --force
            echo "Running database seeders..."
            docker exec crm-api php artisan db:seed --class=UserSeeder --force
          EOF

      - name: Cleanup old images
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VULTR_USER }}@${{ secrets.VULTR_HOST }} "
            for img in ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVER_IMAGE }} ${{ secrets.DOCKER_USERNAME }}/${{ secrets.CLIENT_IMAGE }}; do
              docker images \$img --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +3 | xargs -r -I {} docker rmi \$img:{}
            done
            docker image prune -f
          "

      - name: Deployment Summary
        run: |
          echo "Deployment completed at $(date)"
